<!DOCTYPE html>
<html>
<head>
    <title>редактирование товара</title>
    <link rel="icon" href="/pictures/Комфорт.ico" type="image/x-icon">
</head>
<body>
    <img src="/pictures/Комфорт.png" style="height:200px;width:auto">
    <h1>редактирование товара</h1>
    
    {% if error %}
    <p style="color:red">{{ error }}</p>
    {% endif %}
    
    <form action="/update_product/{{ product_id }}" method="post">
        <p>тип продукта:</p>
        <select name="product_type" required>
            <option value="">выберите тип</option>
            {% for id, name in product_types %}
            <option value="{{ id }}" {% if product_type_id == id %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
        
        <p>название:</p>
        <input type="text" name="product_name" value="{{ product_name }}" required>
        
        <p>артикул:</p>
        <input type="text" name="articul" value="{{ articul }}" required>
        
        <p>цена:</p>
        <input type="number" step="0.01" name="min_partner_cost" value="{{ min_cost_for_partner }}" required>
        
        <p>материал:</p>
        <select name="main_material" required>
            <option value="">выберите материал</option>
            {% for id, name in material_types %}
            <option value="{{ id }}" {% if material_id == id %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
        
        <br><br>
        <button type="submit">сохранить</button>
        <button type="button" onclick="window.location.assign('/')">отмена</button>
    </form>
</body>
</html>
