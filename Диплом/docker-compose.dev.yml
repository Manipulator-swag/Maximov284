version: '3.8'

services:
  web:
    container_name: airport
    image: airport:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=airport;Username=postgres;Password=123"
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    env_file:
      - .env.dev

  postgres:
    container_name: airport_postgres
    image: postgres:12.10
    command: [
      "postgres",
      "-c", "max_connections=50",
      "-c", "shared_buffers=1GB",
      "-c", "effective_cache_size=4GB",
      "-c", "work_mem=16MB",
      "-c", "maintenance_work_mem=512MB",
      "-c", "random_page_cost=1.1",
      "-c", "temp_file_limit=10GB",
      "-c", "log_min_duration_statement=200ms",
      "-c", "idle_in_transaction_session_timeout=10s",
      "-c", "lock_timeout=1s",
      "-c", "statement_timeout=60s",
      "-c", "shared_preload_libraries=pg_stat_statements",
      "-c", "pg_stat_statements.max=10000",
      "-c", "pg_stat_statements.track=all"
    ]
    environment:
      POSTGRES_DB: "airport"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "123"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airport"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G

volumes:
  postgres_data: